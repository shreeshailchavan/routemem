<title>RouteMem Film</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root { --bg: #000; --text: #ededed; --muted: #a1a1a1; --stroke: #2e2e2e; --hover: #1f1f1f; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.55 Geist, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--stroke); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: inherit; text-decoration: none; }
.mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--text); color: var(--bg); }
.crumb { color: var(--muted); }
.spacer { flex: 1; }
.btn { font: inherit; font-size: 13px; font-weight: 500; color: var(--text); background: var(--bg); border: 1px solid var(--stroke); border-radius: 6px; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; text-decoration: none; }
.btn:hover { background: var(--hover); }
main { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 40px 24px 56px; }
h1 { font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.045em; line-height: 1.1; margin: 0 0 10px; }
p { color: var(--muted); margin: 0 0 24px; max-width: 720px; }
video { display: block; width: 100%; height: auto; border: 1px solid var(--stroke); border-radius: 12px; background: #000; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
</style>
</head>
